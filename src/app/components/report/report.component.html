<!-- report.component.html -->

<div class="report" *ngIf="reportData">
  <div class="card-container">
    <div class="card-info">
      <h2 class="card-title">Отчетность</h2>
      <p class="card-description">{{ reportData.description }}</p>
    </div>
  </div>

  <div class="financial-dashboard">
    <div class="btnCards" *ngIf="availableYears.length > 0">
      
      <!-- Проходим по всем доступным годам: [2025, 2024] -->
      <ng-container *ngFor="let year of availableYears">
        
        <!-- ЕСЛИ ЭТО "ТЕКУЩИЙ" ГОД (например, 2025) -->
        <button *ngIf="year === currentApiYear"
                class="button"
                (click)="onYearChange(0)"
                [class.active]="selectedYear === currentApiYear">
          Текущий год
        </button>

        <!-- ЕСЛИ ЭТО ОБЫЧНЫЙ ГОД (например, 2024) -->
        <button *ngIf="year !== currentApiYear"
                class="button"
                (click)="onYearChange(year)"
                [class.active]="selectedYear === year">
          {{ year }}
        </button>
      </ng-container>

    </div>

    <!-- Карточки с данными (без изменений) -->
    <div class="stats-grid">
      <div class="stat-card" *ngFor="let card of reportData.report_indicator; trackBy: trackByCardId">
        <h3>{{ card.name }}</h3>
        <ng-container *ngIf="card.report_indicator_data && card.report_indicator_data.length > 0">
          <div class="data-point">
            <span class="data-label">{{ card.report_indicator_data[0].title }}</span>
            <span class="data-value">{{ card.report_indicator_data[0].description }}</span>
          </div>
          <div class="data-point deviation" *ngIf="card.report_indicator_data.length > 1">
            <span class="data-label">Отклонение (+, -)</span>
            <span class="data-value">{{ card.report_indicator_data[1].description }}</span>
          </div>
        </ng-container>
      </div>
    </div>
    <!-- СЕКЦИЯ С ДОКУМЕНТАМИ И ПАГИНАЦИЕЙ -->
    <div class="documents-section" *ngIf="reportFile.length > 0">
      <div class="document-card" *ngFor="let doc of reportFile; trackBy: trackByDocumentId">
        <img src="../../../assets/icons/файл.png" alt="File" class="pdf-icon">
        <a [href]="imageUrl+doc.upload_file" target="_blank" rel="noopener noreferrer" class="document-link">{{ doc.name }}</a>
      </div>
      
      <!-- Пагинация -->
      <div class="pagination" *ngIf="totalPages > 1">
          <button class="btn" (click)="selectPage(1)" [disabled]="currentPage === 1">«</button>
          <button class="btn" (click)="prevPage()" [disabled]="currentPage === 1">‹</button>
        
          <button class="btn"
            *ngFor="let page of pages"
            [class.active]="page === currentPage"
            (click)="selectPage(page)"
            [disabled]="page === -1">
            {{ page === -1 ? '...' : page }}
          </button>
        
          <button class="btn" (click)="nextPage()" [disabled]="currentPage === totalPages">›</button>
          <button class="btn" (click)="selectPage(totalPages)" [disabled]="currentPage === totalPages">»</button>
      </div>
    </div>
    
    <!-- Сообщение, если документов нет -->
    <div *ngIf="reportFile.length === 0">
      Нет доступных документов.
    </div>
  
  </div>
</div>
