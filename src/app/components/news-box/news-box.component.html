<div class="container_4">
    <div class="box1">
         <h1>{{ 'news.sectionTitle' | translate }}</h1>
         <div class="p" [routerLinkActiveOptions]="{exact: true}" routerLink="/news" routerLinkActive="active" >
             <p>{{ 'links.allNews' | translate }}</p>
            <span><img src="../../../assets/icons/arrow_forward.svg" [alt]="'alt.arrowForward' | translate"></span>
         </div>
    </div>
    
    <div class="box2" *ngIf="news.length>0" >
        <!-- Динамический контент, не требует перевода через пайп -->
        <div class="" *ngFor="let new of news" (click)="navigateToCardDetailsAndForm(new.id)">
            <h3>{{new.title}}</h3>
            <p>{{new.shortDescription}}</p>
            <h1></h1>
            <p>{{new.date_time}}</p>
        </div>
    </div>
</div>
