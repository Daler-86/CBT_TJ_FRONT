
<div class="credit">
    <h1>{{"Consumer loans"|translate}}</h1>
    <div class="btnCards">
        <button (click)="selectTab('all')" [class.active]="selectedTab === 'all'">{{"All"|translate}}</button>
        <button (click)="selectTab('credit')" [class.active]="selectedTab === 'credit'">{{"Credit"|translate}}</button>
        <button (click)="selectTab('auto credit')" [class.active]="selectedTab === 'auto credit'">{{"Car loan"|translate}}</button>
        <button (click)="selectTab('credit stroy')" [class.active]="selectedTab === 'credit stroy'">{{"Construction loan"|translate}}</button>
    </div>
    <div *ngIf="selectedTab==='all'" class="content">


          <div class="card-container" *ngFor="let credit of credits ">
            <div class="card-info">
              <h2 class="card-title">{{credit.title}}
              </h2>
              <p class="card-description">
            {{credit.description}}
              </p>
              <div class="card-details">
                <div class="currency-info" *ngFor="let content of credit.content">
                  <p class="title">{{content.title}}</p>
                  <p class="description">{{content.description}}</p>
                </div>
              </div>
              <div class="card-buttons">
                <button class="btn-primary">{{"Submit an application"|translate}}</button>
                <button class="btn-secondary"  (click)="onCreditClick(credit)" [routerLink]="['/credits', credit.id]" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                  {{"More details"|translate}}
                </button>

              </div>
            </div>
            <div class="card-image">
              <img class="card" [src]="imageUrl + credit.upload_file" alt="Barakat" />

            </div>
          </div>
    </div>
    <div *ngIf="selectedTab==='credit'" class="content"></div>
    <div *ngIf="selectedTab==='auto credit'" class="content"></div>
    <div *ngIf="selectedTab==='credit stroy'" class="content"></div>

    </div>
 <router-outlet></router-outlet>
