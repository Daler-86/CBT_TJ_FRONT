
<div class="credit">
    <h1>Потребительские кредиты</h1>
    <div class="btnCards">
        <button (click)="selectTab('all')" [class.active]="selectedTab === 'all'">Все</button>
        <button (click)="selectTab('credit')" [class.active]="selectedTab === 'credit'">Кредит</button>
        <button (click)="selectTab('auto credit')" [class.active]="selectedTab === 'auto credit'">Автокредит</button>
        <button (click)="selectTab('credit stroy')" [class.active]="selectedTab === 'credit stroy'">Кредит на строительство</button>
    </div>
    <div *ngIf="selectedTab==='all'" class="content">
    
          
          <div class="card-container" *ngFor="let credit of credits ">
            <div class="card-info">
              <h2 class="card-title">{{credit.title}}
              </h2>
              <p class="card-description">
            {{credit.description}}
              </p>
              <div class="card-details">
                <div class="currency-info" *ngFor="let content of credit.content">
                  <p class="title">{{content.title}}</p>
                  <p class="description">{{content.description}}</p>
                </div>
              </div>
              <div class="card-buttons">
                <button class="btn-primary">Оформить заявку</button>
                <button class="btn-secondary"  (click)="onCreditClick(credit)" [routerLink]="['/credits', credit.id]" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                  Подробнее
                </button>
                
              </div>
            </div>
            <div class="card-image">
              <img class="card" [src]="'http://172.16.16.88:9009/storage/' + credit.upload_file" alt="Barakat" />
           
            </div>
          </div>
    
       
        
    </div>
    <div *ngIf="selectedTab==='credit'" class="content"></div>
    <div *ngIf="selectedTab==='auto credit'" class="content"></div>
    <div *ngIf="selectedTab==='credit stroy'" class="content"></div>
   
    </div>
 <router-outlet></router-outlet>
