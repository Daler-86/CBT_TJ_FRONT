@if (cardContent && cardContent.length > 0) {
    <div class="features-container" [ngClass]="featureClass">
      @for (detail of cardContent; track $index) {
        <div class="feature-card">
          <div>
            <h3>{{ detail.title }}</h3>
            <p>{{ detail.description }}</p>
          </div>
          <img [src]="imageUrl + detail.upload_file" [alt]="detail.title" class="feature-icon" />
        </div>
      }
    </div>
  }
