<div class="cards">
  <div class="card-container">
    <div class="card-info">
      <h2 class="card-title">{{ scsData.title }}</h2>
      <p class="card-description">
        {{ scsData.description }}
      </p>
      <div class="card-buttons">
        <button class="btn-primary">{{ 'BUTTONS.OPEN_DEPOSIT' | translate }}</button>
      </div>
    </div>
    <div class="card-image">
      <img class="transfers_img" [src]="imageUrl + scsData.upload_file" [alt]="scsData.title" />
    </div>
  </div>

  <div class="container">
    <h2>{{ 'DEPOSIT_DETAILS.ADVANTAGES_TITLE' | translate }}</h2>
    <div class="advantages">
      <div class="item" *ngFor="let a of scsData.advantages">
        <h3>{{ a.title }}</h3>
        <p>{{ a.description }}</p>
      </div>
    </div>
  </div>

  <div class="faq-container">
    <h2 class="faq-title">{{ 'DEPOSIT_DETAILS.CONDITIONS_TITLE' | translate }}</h2>
    <div *ngFor="let faq of scsData.conditions; let i = index" class="faq-item">
      <div
        class="faq-question"
        (click)="toggleFaq(i)"
        (keydown.enter)="toggleFaq(i)"
        (keydown.space)="toggleFaq(i)"
        tabindex="0"
        role="button"
        [attr.aria-expanded]="selectedFaqIndex === i"
        [attr.aria-controls]="'faq-answer-' + i"
      >
        <span>{{ faq.title }}</span>
        <span class="faq-icon">{{ selectedFaqIndex === i ? '-' : '+' }}</span>
      </div>
      <div *ngIf="selectedFaqIndex === i" class="faq-answer" [id]="'faq-answer-' + i" role="region">
        <!-- И здесь -->
        <p *ngFor="let item of faq.items">{{ item.title }}</p>
      </div>
    </div>
  </div>
</div>
