<div class="vacancies-container">
  <h1>Вакансии</h1>
  <div class="vacancies-list">
    <!-- Фильтры для направлений и городов -->
    <div class="vacancy-filter">
      <p>Фильтры</p>
      <form>
        <label for="category">Направление:</label><br>
        <select id="category" [(ngModel)]="selectedCategory" name="category" (change)="filterVacancies()">
          <option value="">Все направления ({{categories.length}})</option>
          <option *ngFor="let category of categories" [value]="category.name">{{ category.name }}</option>
        </select>
        <br>
        <label for="city">Город:</label><br>
        <select id="city" [(ngModel)]="selectedCity" name="city" (change)="filterVacancies()">
          <option value="">Все города ({{cities.length}})</option>
          <option *ngFor="let city of cities" [value]="city.name">{{ city.name }}</option>
        </select>
      </form>
    </div>
    <!-- Список вакансий -->
    <div class="vacancy-items">
      <p>Всего {{ filteredVacancies.length }} вакансий</p>
      <div *ngFor="let vacancy of filteredVacancies" class="vacancy-item">
        <!-- Используем routerLink для навигации к деталям вакансии -->
        <a [routerLink]="['/vacancy-list', vacancy.id]" (click)="onMoreDetails(vacancy)">
          {{ vacancy.title }}
        </a>
        <div class="city">
          <div class="city-location">
            <img src="../../../assets/icons/Layer 2.svg" alt="Location icon">
            <p>{{ vacancy.city }}</p>
          </div>
          <img src="../../../assets/icons/strel.svg" alt="Arrow icon">
        </div>
      </div>
    </div>
  </div>
</div>
