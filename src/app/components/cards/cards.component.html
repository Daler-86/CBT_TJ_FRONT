<div class="cards">
  <!-- Используем семантический ключ для заголовка -->
  <h1>{{ 'cardsPage.title' | translate }}</h1>

  <div class="btnCards">
    <!-- Используем общий ключ для кнопки "Все" -->
    <button [ngClass]="{'active': selectedTab === 'all'}" (click)="selectTab('all')">
      {{ 'all' | translate }}
    </button>
    <!-- ВАЖНО: Добавлен пайп translate для названий брендов -->
    <button *ngFor="let cBrand of cardBrands"
            [ngClass]="{'active': isBrandSelected(cBrand.id)}"
            (click)="selectBrand(cBrand.id); selectTab('brand')">
      {{ cBrand.name | translate }}
    </button>
  </div>

  <div class="content">
    <div class="card-container" *ngFor="let card of cardList">
      <div class="card-info">
        <h2 class="card-title">{{ card.title }}</h2>
        <p class="card-description">{{ card.description }}</p>
        <div class="card-details">
          <div class="currency-info" *ngFor="let c of card.content">
            <p class="title">{{ c.title }}</p>
            <p class="description">{{ c.description }}</p>
          </div>
        </div>
        <div class="card-buttons">
          <!-- Используем существующие ключи для кнопок -->
          <button class="btn-primary" [routerLink]="['/card-details',card.id]" [queryParams]="{ scrollTo: 'application-form' }">{{ 'buttons.applyForCard' | translate }}</button>
          <button (click)="onCardClick(card.id)" class="btn-secondary" [routerLink]="['/card-details',card.id]" >{{ 'buttons.moreDetails' | translate }}</button>
        </div>
      </div>
      <div class="card-image">
        <!-- Динамический alt-текст - это отличная практика! -->
        <img class="card" [src]="imageUrl + card.upload_file" [alt]="card.title" />
      </div>
    </div>
  </div>
</div>
