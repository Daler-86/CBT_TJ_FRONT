<div class="cards">
  <h1>{{ 'CARDS_PAGE.TITLE' | translate }}</h1>

  <div class="btnCards">
    <button [ngClass]="{ active: selectedTab === 'all' }" (click)="selectTab('all')">
      {{ 'BUTTONS.ALL' | translate }}
    </button>

    @for (cBrand of cardBrands; track $index) {
      <button [ngClass]="{ active: isBrandSelected(cBrand.id) }" (click)="selectBrand(cBrand.id); selectTab('brand')">
        {{ cBrand.name | translate }}
      </button>
    }
  </div>

  <div class="content">
    @for (card of cardList; track $index) {
      <div class="card-container">
        <div class="card-info">
          <h2 class="card-title">{{ card.title }}</h2>
          <p class="card-description">{{ card.description }}</p>

          <div class="card-details">
            @for (c of card.content; track $index) {
              <div class="currency-info">
                <p class="title">{{ c.title }}</p>
                <p class="description">{{ c.description }}</p>
              </div>
            }
          </div>

          <div class="card-buttons">
            <button
              class="btn-primary"
              [routerLink]="['/cards', card.id]"
              [queryParams]="{ scrollTo: 'application-form' }"
            >
              {{ 'BUTTONS.APPLY_FOR_CARD' | translate }}
            </button>
            <button (click)="onCardClick(card.id)" class="btn-secondary" [routerLink]="['/cards', card.id]">
              {{ 'BUTTONS.MORE_DETAILS' | translate }}
            </button>
          </div>
        </div>

        <div class="card-image">
          <img class="card" [src]="imageUrl + card.upload_file" [alt]="card.title" />
        </div>
      </div>
    }
  </div>
</div>
