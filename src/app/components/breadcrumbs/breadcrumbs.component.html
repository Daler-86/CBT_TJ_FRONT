<ng-container *ngIf="(breadcrumbs$ | async) as breadcrumbs">
    <nav aria-label="breadcrumb" *ngIf="breadcrumbs.length > 1" class="breadcrumb-container">
      <ol>
        <li *ngFor="let crumb of breadcrumbs; let last = last">
          <a *ngIf="!last" [routerLink]="crumb.url">{{ crumb.label }}</a>
          <span *ngIf="last" aria-current="page">{{ crumb.label }}</span>
        </li>
      </ol>
    </nav>
  </ng-container>
