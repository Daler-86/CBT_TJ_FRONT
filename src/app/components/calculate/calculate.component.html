<div class="calculator">
  <div class="calculator-tabs">
    <button (click)="selectTab('credit')" [class.active]="selectedTab === 'credit'">{{ 'calculator.tabs.credit' | translate }}</button>
    <button (click)="selectTab('deposit')" [class.active]="selectedTab === 'deposit'">{{ 'calculator.tabs.deposit' | translate }}</button>
    <button (click)="selectTab('car')" [class.active]="selectedTab === 'car'">{{ 'calculator.tabs.carPurchase' | translate }}</button>
    <button (click)="selectTab('installment')" [class.active]="selectedTab === 'installment'">{{'calculator.tabs.rassrochka'|translate}}</button>
  </div>

<div *ngIf="selectedTab === 'credit'">
    <app-loan-calculator  [conditionsData]="mainPageCalculatorData"></app-loan-calculator>
</div>

<div class="" *ngIf="selectedTab === 'deposit'">
<app-deposit-calculator></app-deposit-calculator>
</div>
<div class="" *ngIf="selectedTab === 'installment'">
   <app-installment-calculate></app-installment-calculate>
    </div>
    <div class="" *ngIf="selectedTab === 'car'">
       <app-car-loan-calculate></app-car-loan-calculate>
    </div>
</div>
