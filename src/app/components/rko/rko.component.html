<div class="cards">
  <div class="card-container">
    <div class="card-info">
      <h2 class="card-title">{{ 'RKO.PAGE_TITLE' | translate }}</h2>
      <p class="card-description">{{ 'RKO.PAGE_DESCRIPTION' | translate }}</p>
    </div>
  </div>
  <div class="work-in-progress-container">
    <div class="icon-wrapper">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="64"
        height="64"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
        ></path>
      </svg>
    </div>
    <h2 class="title">{{ 'WORK_IN_PROGRESS.TITLE' | translate }}</h2>
    <!-- <p class="message">{{ 'workInProgress.message' | translate }}</p> -->
    <a routerLink="/" class="home-link">{{ 'WORK_IN_PROGRESS.HOME_LINK' | translate }}</a>
  </div>
