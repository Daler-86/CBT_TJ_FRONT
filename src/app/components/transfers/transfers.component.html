<div class="cards">

  <h1>{{ 'transfers.pageTitle' | translate }}</h1>
  <div class="content">
    <div class="card-container" *ngFor="let transfer of transfersList">

      <div class="card-image">
        <!-- alt-текст берется из динамического поля transfer.title, что корректно -->
        <img class="transfers_img" [src]="imageUrl + transfer.upload_icon_file_id" [alt]="transfer.title"/>
      </div>
      <div class="card-info">
        <h2 class="card-title">{{ transfer.title }}</h2>
        <p class="card-description">
          {{ transfer.description }}
        </p>

        <div class="card-buttons">
          <button (click)="onCardClick(transfer.id)" class="btn-primary"
                  [routerLink]="['/transfers',transfer.id]">{{ 'buttons.moreDetails' | translate }}
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
