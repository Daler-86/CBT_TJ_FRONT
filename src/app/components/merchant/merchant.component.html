<!-- src/app/pages/merchant-list/merchant-list.component.html -->
<!-- Контейнер всей страницы для общих отступов и фона -->
<div class="page-container">

  <!-- Заголовок страницы -->
  <div class="page-header">
    <h1>{{ 'merchantsPage.title' | translate }}</h1>
    <p>{{ 'merchantsPage.subtitle' | translate }}</p>
  </div>

  <!-- Основной контент: фильтры + сетка -->
  <div class="content-wrapper">

    <!-- Блок с фильтрами (левая колонка) -->
    <div class="filters-panel">
      <div class="filter-controls">
        <p class="filters-title">{{ 'merchantsPage.filters.title' | translate }}</p>
        <input
          type="text"
          class="search-input"
          [placeholder]="'merchantsPage.filters.searchPlaceholder' | translate"
          [(ngModel)]="filterName"
          (keyup.enter)="onFilterChange()"
        />

        <select class="filter-select" [(ngModel)]="filterRegionId" (change)="onFilterChange()">
          <option [ngValue]="null">{{ 'merchantsPage.filters.allRegions' | translate }}</option>
          <option *ngFor="let region of regions" [value]="region.id">{{ region.name }}</option>
        </select>

        <select class="filter-select" [(ngModel)]="filterCategoryId" (change)="onFilterChange()">
          <option [ngValue]="null">{{ 'merchantsPage.filters.allCategories' | translate }}</option>
          <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
        </select>

        <div class="cashback-toggle">
          <label for="cashback">{{ 'merchantsPage.filters.cashbacks' | translate }}</label>
          <label class="switch">
            <input
              type="checkbox"
              id="cashback"
              [(ngModel)]="filterHasCashback"
              (change)="onFilterChange()"
            />
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Сетка с карточками мерчантов (правая колонка) -->
    <div class="merchants-grid">
      <div class="merchant-card" *ngFor="let merchant of merchants">
        <div class="card-logo-wrapper">
          <img [src]="imageUrl+merchant.upload_file" [alt]="merchant.name" class="card-logo" />
        </div>
        <h3 class="card-name">{{ merchant.name }}</h3>
        <p class="card-phone">{{ merchant.phone }}</p>
        <p class="card-address">{{ merchant.address }}</p>
      </div>
    </div>
  </div>
  
  <!-- Пагинация -->
  <div class="pagination-container" *ngIf="totalPages >= 1">
    <button (click)="selectPage(1)" [disabled]="currentPage === 1" [title]="'common.pagination.firstPage' | translate">«</button>
    <button (click)="prevPage()" [disabled]="currentPage === 1" [title]="'common.pagination.previousPage' | translate">‹</button>
    
    <button *ngFor="let page of pages" 
            [class.active]="page === currentPage"
            [disabled]="page === -1"
            (click)="selectPage(page)">
      {{ page === -1 ? '...' : page }}
    </button>
  
    <button (click)="nextPage()" [disabled]="currentPage === totalPages" [title]="'common.pagination.nextPage' | translate">›</button>
    <button (click)="selectPage(totalPages)" [disabled]="currentPage === totalPages" [title]="'common.pagination.lastPage' | translate">»</button>
  </div>
</div>
