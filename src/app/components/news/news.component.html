<section class="news-events-section">
  <div class="section-header">
    <h1>{{ 'NEWS_PAGE.TITLE' | translate }}</h1>
    <p class="subtitle">{{ 'NEWS_PAGE.SUBTITLE' | translate }}</p>
  </div>

  <div class="news-list">
    <ng-container *ngIf="news.length > 0; else noNews">
      <article class="news-card" *ngFor="let item of news">
        <a
          [routerLink]="['/news', item.id]"
          class="news-card-link"
          tabindex="0"
          role="link"
          [attr.aria-label]="item.title + '. ' + ('NEWS_PAGE.READ_MORE' | translate)"
        >
          <div class="news-text-content">
            <h2>{{ item.title }}</h2>
            <p class="article-content">
              {{ item.firstParagraphText | slice: 0 : 200 }}
            </p>
          </div>
          <div class="news-image-content">
            <img [src]="imageUrl + item.upload_file" [alt]="item.title" />
          </div>
        </a>
      </article>

      <div class="pagination" role="navigation" [attr.aria-label]="'common.pagination.label' | translate">
        <button
          (click)="selectPage(1)"
          [disabled]="currentPage === 1"
          [title]="'common.pagination.firstPage' | translate"
          [attr.aria-label]="'common.pagination.firstPage' | translate"
        >
          «
        </button>
        <button
          (click)="prevPage()"
          [disabled]="currentPage === 1"
          [title]="'common.pagination.previousPage' | translate"
          [attr.aria-label]="'common.pagination.previousPage' | translate"
        >
          ‹
        </button>

        <button
          *ngFor="let page of pages"
          [class.active]="page === currentPage"
          (click)="selectPage(page)"
          [attr.aria-label]="
            page === -1
              ? ('common.pagination.ellipsis' | translate)
              : ('common.pagination.gotoPage' | translate) + ' ' + page
          "
          [attr.aria-current]="page === currentPage ? 'page' : null"
          [disabled]="page === -1"
        >
          {{ page === -1 ? '...' : page }}
        </button>

        <button
          (click)="nextPage()"
          [disabled]="currentPage === totalPages"
          [title]="'common.pagination.nextPage' | translate"
          [attr.aria-label]="'common.pagination.nextPage' | translate"
        >
          ›
        </button>
        <button
          (click)="selectPage(totalPages)"
          [disabled]="currentPage === totalPages"
          [title]="'common.pagination.lastPage' | translate"
          [attr.aria-label]="'common.pagination.lastPage' | translate"
        >
          »
        </button>
      </div>
    </ng-container>

    <!-- Сообщение, если нет новостей -->
    <ng-template #noNews>
      <p class="no-news-message">{{ 'NEWS_PAGE.NO_NEWS_MESSAGE' | translate }}</p>
    </ng-template>
  </div>
</section>
