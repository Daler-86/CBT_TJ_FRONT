<div class="bankDetail">
    <div class="card-container">
        <div class="card-info">
          <h2 class="card-title">Реквизиты</h2>
          <p class="card-description">
            Банковские реквизиты для финансовых операций
          </p>
          
        </div>
    
      </div>
    <div class="info-list-container">
        <div class="info-item-row" *ngFor="let item of bankdetailList; ">
          <div class="info-label">{{ item.title }}</div>
          <div class="info-value">

            <ng-container >{{ item.description }}</ng-container>
          </div>
        </div>
      
     
      </div>
</div>
