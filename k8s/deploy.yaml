apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-app
  annotations:
    argocd-image-updater.argoproj.io/image-list: angular-app=daler86/cbt-front
    argocd-image-updater.argoproj.io/angular-app.update-strategy: semver
    argocd-image-updater.argoproj.io/angular-app.allow-tags: regexp:^[0-9]+\\.[0-9]+$
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  replicas: 2
  selector:
    matchLabels:
      app: angular-app
  template:
    metadata:
      labels:
        app: angular-app
    spec:
      containers:
        - name: angular-app
          image: daler86/cbt-front:1.2
          ports:
            - containerPort: 80
